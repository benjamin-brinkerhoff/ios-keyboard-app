name: KeyboardApp
options:
  bundleIdPrefix: com.ioskeyboard
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  KeyboardApp:
    type: application
    platform: iOS
    sources:
      - path: KeyboardApp
      - path: Shared
    info:
      path: KeyboardApp/Info.plist
    entitlements:
      path: KeyboardApp/KeyboardApp.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ioskeyboard.app
        INFOPLIST_FILE: KeyboardApp/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: KeyboardExtension
        embed: true

  KeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: KeyboardExtension
      - path: Shared
    info:
      path: KeyboardExtension/Info.plist
    entitlements:
      path: KeyboardExtension/KeyboardExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ioskeyboard.app.keyboard
        INFOPLIST_FILE: KeyboardExtension/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
        SKIP_INSTALL: NO
