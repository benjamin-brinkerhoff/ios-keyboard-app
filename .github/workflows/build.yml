name: Build & Package Unsigned IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_PATH" ]; then
            echo "Xcode 16 not found via wildcard, listing all available Xcode installations:"
            ls -d /Applications/Xcode*.app
            XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          fi
          echo "Selected Xcode: $XCODE_PATH"
          sudo xcode-select --switch "$XCODE_PATH"

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Application and Extension (Unsigned)
        run: |
          xcodebuild \
            -project KeyboardApp.xcodeproj \
            -scheme KeyboardApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Payload into Unsigned IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find derivedData/Build/Products/Release-iphoneos -name "KeyboardApp.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: KeyboardApp.app not found in build products!"
            exit 1
          fi
          echo "Found built application at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/

          # Ensure KeyboardExtension.appex is inside PlugIns
          EXT_PATH=$(find derivedData/Build/Products/Release-iphoneos -name "KeyboardExtension.appex" -type d | head -n 1)
          if [ -n "$EXT_PATH" ]; then
            mkdir -p build/Payload/KeyboardApp.app/PlugIns
            if [ ! -d "build/Payload/KeyboardApp.app/PlugIns/KeyboardExtension.appex" ]; then
              echo "Embedding KeyboardExtension.appex into PlugIns..."
              cp -r "$EXT_PATH" build/Payload/KeyboardApp.app/PlugIns/
            fi
          fi

          # Ad-hoc codesign binary and extension for sideloading compatibility
          echo "Applying ad-hoc code signature..."
          if [ -d "build/Payload/KeyboardApp.app/PlugIns/KeyboardExtension.appex" ]; then
            codesign --force --deep --sign - --entitlements KeyboardExtension/KeyboardExtension.entitlements build/Payload/KeyboardApp.app/PlugIns/KeyboardExtension.appex 2>/dev/null || true
          fi
          codesign --force --deep --sign - --entitlements KeyboardApp/KeyboardApp.entitlements build/Payload/KeyboardApp.app 2>/dev/null || true

          cd build
          zip -r -y KeyboardApp-unsigned.ipa Payload
          echo "Successfully packaged KeyboardApp-unsigned.ipa:"
          ls -lh KeyboardApp-unsigned.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardApp-unsigned-ipa
          path: build/KeyboardApp-unsigned.ipa
          retention-days: 14
